<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="t d">
  <title id="t">Serverless telemetry parser architecture</title>
  <desc id="d">An API Gateway POST /parse request enters a Lambda container image. The handler, layouts, preprocess, ONNX Runtime inference and extractor stages run in order, then rows go to DynamoDB. A build path trains a PyTorch glyph model, exports and quantises it to ONNX, packs it into a Docker image, pushes to ECR and deploys to Lambda. A note states the cold start target of under 200 ms.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; font-size: 14px; }
      .sub { fill: #8b949e; font-size: 12px; }
      .head { font-size: 16px; font-weight: 600; }
      .node { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .group { fill: none; stroke: #30363d; stroke-width: 1; stroke-dasharray: 4 4; }
      .focus { fill: #161b22; stroke: #58a6ff; stroke-width: 1; }
      .out { fill: #161b22; stroke: #3fb950; stroke-width: 1; }
      .note { fill: #0d1117; stroke: #58a6ff; stroke-width: 1; stroke-dasharray: 2 3; }
      .edge { fill: none; stroke: #30363d; stroke-width: 1.5; }
      .flow { fill: none; stroke: #58a6ff; stroke-width: 1.5; stroke-dasharray: 6 10; animation: pulse 1.6s linear infinite; }
      .flow-out { stroke: #3fb950; }
      @keyframes pulse { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -16; } }
      .d1 { animation-delay: 0s; } .d2 { animation-delay: .2s; } .d3 { animation-delay: .4s; }
      .d4 { animation-delay: .6s; } .d5 { animation-delay: .8s; } .d6 { animation-delay: 1s; }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; stroke-dasharray: none; } }
    </style>
  </defs>
  <rect width="960" height="480" fill="#0d1117"/>
  <text x="30" y="40" class="head">Serverless telemetry parser</text>
  <text x="30" y="92" class="sub">Request path</text>

  <!-- Lambda container group -->
  <rect x="178" y="108" width="600" height="146" rx="6" class="group"/>
  <text x="196" y="130" class="sub">Lambda container image, CMD tel_parser.handler.handler</text>

  <!-- Request path nodes -->
  <rect x="30" y="150" width="120" height="60" rx="6" class="node"/>
  <text x="90" y="176" text-anchor="middle">API Gateway</text>
  <text x="90" y="194" text-anchor="middle" class="sub">POST /parse</text>

  <rect x="196" y="150" width="94" height="60" rx="6" class="focus"/>
  <text x="243" y="176" text-anchor="middle">handler.py</text>
  <text x="243" y="194" text-anchor="middle" class="sub">handle()</text>

  <rect x="314" y="150" width="94" height="60" rx="6" class="node"/>
  <text x="361" y="176" text-anchor="middle">layouts.py</text>
  <text x="361" y="194" text-anchor="middle" class="sub">ROI templates</text>

  <rect x="432" y="150" width="94" height="60" rx="6" class="node"/>
  <text x="479" y="176" text-anchor="middle">preprocess.py</text>
  <text x="479" y="194" text-anchor="middle" class="sub">crops</text>

  <rect x="550" y="150" width="94" height="60" rx="6" class="focus"/>
  <text x="597" y="176" text-anchor="middle">inference.py</text>
  <text x="597" y="194" text-anchor="middle" class="sub">ONNX Runtime</text>

  <rect x="668" y="150" width="94" height="60" rx="6" class="node"/>
  <text x="715" y="176" text-anchor="middle">extractor.py</text>
  <text x="715" y="194" text-anchor="middle" class="sub">decode stats</text>

  <rect x="808" y="150" width="122" height="60" rx="6" class="out"/>
  <text x="869" y="176" text-anchor="middle">DynamoDB</text>
  <text x="869" y="194" text-anchor="middle" class="sub">storage.py put</text>

  <!-- Request path connectors -->
  <g marker-end="url(#ah)">
    <path class="edge" d="M150 180 H194" marker-end="url(#ah)"/>
    <path class="edge" d="M290 180 H312" marker-end="url(#ah)"/>
    <path class="edge" d="M408 180 H430" marker-end="url(#ah)"/>
    <path class="edge" d="M526 180 H548" marker-end="url(#ah)"/>
    <path class="edge" d="M644 180 H666" marker-end="url(#ah)"/>
  </g>
  <path class="edge" d="M762 180 H806" marker-end="url(#ag)"/>
  <path class="flow d1" d="M150 180 H194"/>
  <path class="flow d2" d="M290 180 H312"/>
  <path class="flow d3" d="M408 180 H430"/>
  <path class="flow d4" d="M526 180 H548"/>
  <path class="flow d5" d="M644 180 H666"/>
  <path class="flow flow-out d6" d="M762 180 H806"/>

  <!-- Cold start target note -->
  <rect x="760" y="290" width="170" height="56" rx="6" class="note"/>
  <text x="845" y="314" text-anchor="middle">cold start target &lt; 200 ms</text>
  <text x="845" y="332" text-anchor="middle" class="sub">design target, not measured</text>

  <!-- Build path -->
  <text x="30" y="350" class="sub">Build path</text>
  <rect x="30" y="370" width="120" height="60" rx="6" class="node"/>
  <text x="90" y="396" text-anchor="middle">PyTorch</text>
  <text x="90" y="414" text-anchor="middle" class="sub">model.train</text>

  <rect x="174" y="370" width="160" height="60" rx="6" class="node"/>
  <text x="254" y="396" text-anchor="middle">export_onnx</text>
  <text x="254" y="414" text-anchor="middle" class="sub">int8 quantise</text>

  <rect x="358" y="370" width="110" height="60" rx="6" class="node"/>
  <text x="413" y="396" text-anchor="middle">model.onnx</text>
  <text x="413" y="414" text-anchor="middle" class="sub">glyphs_int8</text>

  <rect x="492" y="370" width="110" height="60" rx="6" class="node"/>
  <text x="547" y="396" text-anchor="middle">Docker image</text>
  <text x="547" y="414" text-anchor="middle" class="sub">Lambda base</text>

  <rect x="626" y="370" width="100" height="60" rx="6" class="focus"/>
  <text x="676" y="396" text-anchor="middle">ECR</text>
  <text x="676" y="414" text-anchor="middle" class="sub">Terraform</text>

  <path class="edge" d="M150 400 H172" marker-end="url(#ah)"/>
  <path class="edge" d="M334 400 H356" marker-end="url(#ah)"/>
  <path class="edge" d="M468 400 H490" marker-end="url(#ah)"/>
  <path class="edge" d="M602 400 H624" marker-end="url(#ah)"/>
  <path class="edge" d="M676 370 V256" marker-end="url(#ah)"/>
  <path class="flow d1" d="M150 400 H172"/>
  <path class="flow d2" d="M334 400 H356"/>
  <path class="flow d3" d="M468 400 H490"/>
  <path class="flow d4" d="M602 400 H624"/>
  <path class="flow d5" d="M676 370 V256"/>
  <text x="688" y="320" class="sub">deploy</text>
</svg>
