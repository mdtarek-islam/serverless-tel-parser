name: tel-parser-ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tel-parser-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SECRET_RE: 'sk-ant-[A-Za-z0-9_-]{15,}|sk-(proj-)?[A-Za-z0-9]{20,}|sbp_[A-Za-z0-9]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|xox[baprs]-[0-9A-Za-z-]{10,}|-----BEGIN [A-Z ]+PRIVATE KEY-----'

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks CLI)
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          # SHA256 from the official gitleaks_8.18.4_checksums.txt release asset.
          echo "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" detect --source . --redact --no-banner

      - name: Secret scan (regex fallback)
        run: |
          if git ls-files -z | xargs -0 grep -nIE -e "$SECRET_RE" --; then
            echo "FAIL: secret pattern found in tracked files"
            exit 1
          fi
          echo "PASS: no secret pattern in tracked files"

  quality:
    name: Lint and types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Typecheck (mypy)
        run: mypy src

  security:
    name: Static and dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Static security scan (bandit)
        run: bandit -q -r src -ll

      - name: Dependency audit (pip-audit)
        run: |
          pip-audit -r requirements.txt --progress-spinner off
          pip-audit -r requirements-dev.txt --progress-spinner off

  tests:
    name: Tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit tests with 90 percent coverage gate
        run: pytest -q --cov=tel_parser --cov-branch --cov-report=term-missing --cov-fail-under=90

  terraform:
    name: Terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Format check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Init without backend
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: Validate
        run: terraform -chdir=terraform validate

  container:
    name: Container build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build image (no push)
        run: docker build --progress=plain -t tel-parser:ci .

      - name: Boot image and post a malformed event
        run: |
          docker run -d --name tel-parser-ci -p 9000:8080 tel-parser:ci
          trap 'docker logs tel-parser-ci || true; docker stop tel-parser-ci >/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -s -o /dev/null -X POST "http://localhost:9000/2015-03-31/functions/function/invocations" -d '{}'; then
              break
            fi
            sleep 1
          done
          response="$(curl -s -X POST "http://localhost:9000/2015-03-31/functions/function/invocations" -d '{"body": "not json"}')"
          echo "$response"
          echo "$response" | grep -q '"statusCode": *400'
          echo "PASS: malformed event returned statusCode 400"

  governance:
    name: Governance guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLAUDE_PROJECT_DIR: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install jq
        if: ${{ hashFiles('.claude/hooks/guard-claude-md.sh') != '' }}
        run: command -v jq >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y jq)

      - name: CLAUDE.md line count and duplicate rules
        if: ${{ hashFiles('.claude/hooks/guard-claude-md.sh') != '' }}
        run: bash "$CLAUDE_PROJECT_DIR/.claude/hooks/guard-claude-md.sh" --audit

      - name: Skill and hook integrity scan
        if: ${{ hashFiles('.claude/hooks/scan-skill.sh') != '' }}
        run: |
          bash "$CLAUDE_PROJECT_DIR/.claude/hooks/scan-skill.sh" all
          echo "PASS: skill scan clean"

      - name: Skipped
        if: ${{ hashFiles('.claude/hooks/guard-claude-md.sh') == '' }}
        run: echo "Governance hook files are absent. Nothing to check."
